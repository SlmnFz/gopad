services:
  gopad:
    build:
      context: .
    image: gopad:local
    environment:
      GOPAD_ADDR: "${GOPAD_ADDR:-:8080}"
      GOPAD_DB_PATH: "${GOPAD_DB_PATH:-/data/gopad.db}"
      GOPAD_ROOM_IDLE_TIMEOUT: "${GOPAD_ROOM_IDLE_TIMEOUT:-45s}"
      GOPAD_WRITE_QUEUE_SIZE: "${GOPAD_WRITE_QUEUE_SIZE:-1024}"
      GOPAD_OP_BATCH_SIZE: "${GOPAD_OP_BATCH_SIZE:-100}"
      GOPAD_OP_FLUSH_INTERVAL: "${GOPAD_OP_FLUSH_INTERVAL:-250ms}"
      GOPAD_SNAPSHOT_OP_THRESHOLD: "${GOPAD_SNAPSHOT_OP_THRESHOLD:-1000}"
      GOPAD_SNAPSHOT_INTERVAL: "${GOPAD_SNAPSHOT_INTERVAL:-30s}"
      GOPAD_ENABLE_PPROF: "${GOPAD_ENABLE_PPROF:-0}"
    ports:
      - "${GOPAD_HTTP_PORT:-8080}:8080"
    volumes:
      - gopad-data:/data
    networks:
      - gopad

  prometheus:
    image: prom/prometheus:v2.53.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - gopad

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "${GRAFANA_ALLOW_SIGN_UP:-false}"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - gopad

volumes:
  gopad-data:
  prometheus-data:
  grafana-data:

networks:
  gopad:
    driver: bridge
