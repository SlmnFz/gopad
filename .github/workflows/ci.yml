name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go tests with race detector
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run browser tests
        run: node --test web/assets/*.test.js

  fuzz:
    name: CRDT fuzz smoke test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run bounded CRDT fuzzing
        run: go test ./internal/crdt -fuzz=FuzzTwoReplicaConverge -fuzztime=60s

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start the local observability stack
        run: docker compose up --build --detach

      - name: Check application, metrics, Prometheus, and Grafana
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/healthz
          metrics="$(curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8080/metrics)"
          echo "$metrics"
          echo "$metrics" | grep -q 'gopad_operations_total'
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:9090/-/ready
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health

      - name: Stop the local observability stack
        if: always()
        run: docker compose down --volumes
