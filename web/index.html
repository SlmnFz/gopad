<!doctype html>
<html lang="en" dir="auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#05080a">
    <title>Gopad — collaborative plain text</title>
    <link rel="icon" href="/assets/gopad-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/style.css">
  </head>
  <body class="site-body">
    <main class="page-shell landing">
      <div class="landing-card">
        <div class="brand-lockup">
          <p class="eyebrow">NODE // GOPAD</p>
          <span class="brand-subtitle">COLLABORATIVE TEXT NETWORK</span>
        </div>
        <div class="signal-rule" aria-hidden="true"></div>
        <h1 id="landing-title">A shared space for plain text.</h1>
        <p class="lede">Create a document, share its link, and edit together in real time.</p>
        <div class="landing-actions">
          <button id="create-document" class="primary-button" type="button">New document</button>
          <p id="status" class="status" role="status"></p>
        </div>
        <dl class="telemetry" aria-label="Gopad system information">
          <div>
            <dt>ACCESS</dt>
            <dd>LINK-SHARED</dd>
          </div>
          <div>
            <dt>MODE</dt>
            <dd>PLAIN TEXT</dd>
          </div>
          <div>
            <dt>SYNC</dt>
            <dd>LIVE / CRDT</dd>
          </div>
        </dl>
      </div>
    </main>
    <script type="module">
      import { decryptReveal } from "/assets/decrypt.js";

      const button = document.querySelector('#create-document');
      const status = document.querySelector('#status');
      void decryptReveal(document.querySelector('#landing-title'), 'A shared space for plain text.', { duration: 760, frames: 24 });
      button.addEventListener('click', async () => {
        button.disabled = true;
        status.textContent = 'Creating document…';
        try {
          const response = await fetch('/documents', { method: 'POST' });
          if (!response.ok) throw new Error('create failed');
          const { slug } = await response.json();
          window.location.href = `/d/${slug}`;
        } catch {
          button.disabled = false;
          status.textContent = 'Could not create a document. Please try again.';
        }
      });
    </script>
  </body>
</html>
