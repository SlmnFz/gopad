<!doctype html>
<html lang="en" dir="auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gopad editor</title>
    <meta name="theme-color" content="#05080a">
    <link rel="icon" href="/assets/gopad-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/style.css">
  </head>
  <body class="site-body">
    <main class="page-shell editor-shell">
      <header class="editor-header">
        <div class="brand-lockup">
          <a class="wordmark" href="/">GOPAD</a>
          <span class="brand-subtitle">LIVE TEXT NODE</span>
        </div>
        <div class="connection-cluster">
          <span class="connection-indicator" aria-hidden="true"></span>
          <p id="connection-status" class="status" role="status">Preparing editor…</p>
        </div>
      </header>
      <section class="editor-panel" aria-label="Collaborative document">
        <div class="panel-bar">
          <span>DOCUMENT CHANNEL</span>
          <div class="presence-cluster" aria-live="polite">
            <span id="presence-status">0 COLLABORATORS</span>
            <div id="presence-list" class="presence-list" aria-label="Active collaborators"></div>
          </div>
          <label class="direction-control" for="direction-toggle">
            DIR
            <select id="direction-toggle" aria-label="Text direction">
              <option value="auto">AUTO</option>
              <option value="ltr">LTR</option>
              <option value="rtl">RTL</option>
            </select>
          </label>
          <button id="history-open" class="history-open-button" type="button" aria-controls="history-scrubber">HISTORY // OPEN</button>
        </div>
        <div class="editor-stage">
          <textarea id="editor" class="editor" aria-label="Document text" dir="auto" placeholder="Start writing…" disabled></textarea>
          <div id="remote-cursors" class="remote-cursors" aria-hidden="true"></div>
        </div>
      </section>
      <div id="history-scrubber" aria-label="Document history scrubber"></div>
      <footer class="editor-footer" aria-hidden="true">
        <span>LINK-SHARED ACCESS</span>
        <span>SEQUENCE SYNC // ACTIVE</span>
      </footer>
    </main>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
