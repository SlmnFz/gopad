<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gopad editor</title>
    <link rel="stylesheet" href="/assets/style.css">
  </head>
  <body class="site-body">
    <main class="page-shell editor-shell">
      <header class="editor-header">
        <div class="brand-lockup">
          <a class="wordmark" href="/">GOPAD</a>
          <span class="brand-subtitle">LIVE TEXT NODE</span>
        </div>
        <div class="connection-cluster">
          <span class="connection-indicator" aria-hidden="true"></span>
          <p id="connection-status" class="status" role="status">Preparing editor…</p>
        </div>
      </header>
      <section class="editor-panel" aria-label="Collaborative document">
        <div class="panel-bar" aria-hidden="true">
          <span>DOCUMENT CHANNEL</span>
          <span id="presence-status">0 COLLABORATORS</span>
          <span>/// ENCRYPTION: NONE / V1</span>
        </div>
        <div class="editor-stage">
          <textarea id="editor" class="editor" aria-label="Document text" placeholder="Start writing…" disabled></textarea>
          <div id="remote-cursors" class="remote-cursors" aria-hidden="true"></div>
        </div>
      </section>
      <footer class="editor-footer" aria-hidden="true">
        <span>LINK-SHARED ACCESS</span>
        <span>SEQUENCE SYNC // ACTIVE</span>
      </footer>
    </main>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
